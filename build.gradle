plugins {
    id 'java'
    id 'application'
    id("com.github.johnrengelman.shadow") version "8.1.1"
}

group = 'io.github.quackiemackie.wondie'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/net.dv8tion/JDA
    implementation("net.dv8tion:JDA:5.5.0")

    // https://mvnrepository.com/artifact/io.prometheus/simpleclient
    implementation("io.prometheus:simpleclient:0.16.0")
    // https://mvnrepository.com/artifact/io.prometheus/simpleclient_hotspot
    implementation("io.prometheus:simpleclient_hotspot:0.16.0")
    // https://mvnrepository.com/artifact/io.prometheus/simpleclient_httpserver
    implementation("io.prometheus:simpleclient_httpserver:0.16.0")

    // https://mvnrepository.com/artifact/com.github.oshi/oshi-core
    implementation("com.github.oshi:oshi-core:6.8.1")

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation("org.slf4j:slf4j-api:2.0.17")
    // https://mvnrepository.com/artifact/ch.qos.logback/logback-classic
    implementation("ch.qos.logback:logback-classic:1.5.18")
    // https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    runtimeOnly("org.slf4j:slf4j-simple:2.0.17")
}

application {
    mainClass = 'io.github.quackiemackie.wondie.Main'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

shadowJar {
    archiveClassifier.set('')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = true
    sourceCompatibility = '21'
}